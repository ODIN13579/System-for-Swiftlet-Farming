# Isolated disposable fixtures; never points to the development database or broker ACL.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: build2_test
      POSTGRES_USER: build2
      POSTGRES_PASSWORD: build2-test-only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build2 -d build2_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - build2_test_data:/var/lib/postgresql/data
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:51884:1883"
    volumes:
      - ./scripts/build2-test-mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m probe"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  build2_test_data:
